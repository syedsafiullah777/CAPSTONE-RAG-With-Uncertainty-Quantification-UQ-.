# V2 experiment configuration — Phase 1 foundation.
# Values marked NEEDS_VERIFICATION must be confirmed before the full benchmark.
# Do not treat placeholders as scientifically locked.

project:
  name: "msc-rag-v2"
  title: "Multi-Agent RAG with Uncertainty Quantification for Financial Document QA"
  version: "0.1.0-phase1"

paths:
  # Relative to V2 project root unless overridden at runtime.
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_calibration: "data/calibration"
  data_final: "data/final"
  knowledge_base: "knowledge_base"
  kb_documents: "knowledge_base/documents"
  kb_index: "knowledge_base/index"
  results_raw: "results/raw"
  results_processed: "results/processed"
  results_final: "results/final"
  results_checkpoints: "results/checkpoints"
  results_logs: "results/logs"
  results_config: "results/config"
  results_metrics: "results/metrics"

dataset:
  # NEEDS_VERIFICATION: confirm via load_dataset in Phase 3.
  family: "T2-RAGBench"
  huggingface_id: "G4KMU/t2-ragbench"
  subset: "FinQA"
  test_split: "test"
  calibration_split: "dev"
  prototype_split: "train"
  frozen_test_size: 140
  architectures: 3
  total_cases: 420
  sampling_seed: 42  # FROZEN in Phase 4 — do not change after selected_140_questions.csv
  frozen_test_set: "data/final/selected_140_questions.csv"
  sampling_manifest: "data/final/sampling_manifest.json"
  calibration_size: 40
  calibration_seed: 42
  frozen_calibration_set: "data/calibration/calibration_questions.csv"
  calibration_manifest: "data/calibration/calibration_manifest.json"
  # Phase 2–3 verified live load (see docs/phase3_dataset_verification.md):
  verified_split_counts:
    train: 6251
    dev: 883
    test: 1147
    total: 8281
  source_pdf_path_template: "data/FinQA/{split}/{file_name}"
  test_pdfs_resolved: 380
  test_pdfs_missing: 0
  # Phase 4 freeze summary (see sampling_manifest.json for authority):
  phase4_frozen: true
  phase4_n: 140
  phase4_unique_companies: 77
  phase4_unique_files: 140
  phase4_selected_ids_sha256: "1a69d93e412097a076e8ec836253b8fff53366aefc5ea5f8998020984f6bbd8a"
  # Phase 5 calibration freeze (threshold NOT locked yet):
  phase5_frozen: true
  phase5_n: 40
  phase5_unique_companies: 32
  phase5_unique_files: 40
  phase5_selected_ids_sha256: "b229d45331fc18dd7c784175abd37cee3550775f268c843b2417d3f9d2e3aeca"
  phase5_threshold_locked: false

model:
  name: "Qwen3-8B"
  # Primary remote path: llama_cpp (GGUF on Colab GPU). auto falls back to transformers/CUDA then ollama_dev.
  backend: "auto"
  quantisation: "Q4_K_M"
  model_path: null
  hf_repo_id: "bartowski/Qwen_Qwen3-8B-GGUF"
  gguf_filename: "Qwen_Qwen3-8B-Q4_K_M.gguf"
  hf_model_id: "Qwen/Qwen3-8B"
  ollama_model: "qwen3:8b"  # optional local smoke only
  n_ctx: 4096
  n_gpu_layers: -1
  load_in_4bit: true
  temperature: 0.1
  top_p: null
  top_k: null
  max_new_tokens: 512
  # Final 420-case benchmark must use Colab GPU (llama_cpp or transformers), not Mac Ollama.

# Remote execution (Phase 7 strategy — architecture unchanged).
remote_execution:
  strategy: "google_colab_gpu_notebook"
  primary_entrypoint: "notebooks/colab_phase7_smoke.ipynb"
  phase8_entrypoint: "notebooks/colab_phase8_smoke.ipynb"
  phase9_entrypoint: "notebooks/colab_phase9_smoke.ipynb"
  phase10_entrypoint: "notebooks/colab_phase10_smoke.ipynb"
  phase11_entrypoint: "notebooks/colab_phase11_live.ipynb"
  phase12_entrypoint: "notebooks/colab_phase12_pilot.ipynb"
  phase13_entrypoint: "notebooks/colab_phase13_calibration.ipynb"
  phase14_entrypoint: "notebooks/colab_phase14_benchmark_validation.ipynb"
  phase15_entrypoint: "notebooks/colab_phase15_full_benchmark.ipynb"
  phase16_judge_entrypoint: "notebooks/colab_phase16_judge.ipynb"
  notes_md: "notebooks/colab_runtime.md"
  colab_cli: false  # not used; standard Colab notebook Runtime → GPU
  colab_gpu_verification: "PASS"  # Phase 7 verified 2026-08-22 Tesla T4 llama_cpp
  phase8_colab_retrieval_fix: "rebuild_index_on_colab"  # Option B — build_index.py before smoke
  preserves:
    - "Qwen3-8B"
    - "src/models backend abstraction"
    - "runtime fingerprinting"
    - "checkpointing / resumable benchmark design"

embeddings:
  model: "BAAI/bge-small-en-v1.5"
  version: null  # Hugging Face revision pin NEEDS VERIFICATION if required for paper

retrieval:
  vector_store: "chroma"
  collection_name: "finqa_source_pdfs"
  top_k: 4
  chunk_size: 900
  chunk_overlap: 150
  # Phase 6 verified build:
  phase6_built: true
  phase6_docs_indexed: 230
  phase6_chunks: 1239
  phase6_distractors: 50
  phase6_download_failed: 0
  index_manifest: "knowledge_base/index/index_manifest.json"

rag:
  architectures:
    single_agent:
      enabled: true
      phase: 8
      name: "single_agent"
    multi_agent:
      enabled: true
      phase: 9
      name: "multi_agent"
      verification_threshold: 0.5
    multi_agent_uq:
      enabled: true
      phase: 10
      name: "multi_agent_uq"
      verification_threshold: 0.5
  phase8_smoke_n: 3
  phase9_smoke_n: 3
  phase10_smoke_n: 3
  phase11_smoke_n: 2  # 1 frozen + 1 fresh live comparison
  phase12_pilot_n: 6  # 6 frozen questions × 3 architectures = 18 cases; not the 420-case benchmark
  phase14_validation_n: 3  # 3 frozen questions × 3 architectures = 9 cases; full 420 is not launched here

uncertainty:
  # Official T is results/config/threshold.lock.json (Phase 13 Colab: T=0.65, DEV 40 only).
  # Keep yaml null so Phase 12 cannot pick up a locked yaml value. Phase 14 must load the lock file.
  # Never tune on the frozen 140.
  confidence_threshold: null
  smoke_threshold: 0.55  # smoke/pilot/live fallback — NOT the locked benchmark threshold
  calibration:
    n: 40
    coverage_floor: 0.50
    rule: "max_selective_accuracy_coverage_ge_0.50"
    tie_break: "lowest_threshold"
    architecture: "multi_agent_uq"
    lock_file: "results/config/threshold.lock.json"
  method: "mean_retrieval_verification"
  abstention_message: "I cannot answer reliably because supporting evidence is insufficient."

evaluation:
  # Phase 16 CPU scoring of saved Phase 15 cases (no RAG rerun).
  # Separate post-hoc job: LLM-as-judge faithfulness (Qwen3-8B, custom/RAGAS-inspired). Not official RAGAS.
  primary_answer_field: "program_answer"
  secondary_answer_field: "original_answer"
  numeric_rel_tol: 0.01
  phase16_entrypoint: "scripts/run_evaluation.py"
  phase16_judge_entrypoint: "scripts/run_judge.py"
  phase17_entrypoint: "scripts/run_statistics.py"
  phase17_uses_llm_inference: false
  phase17_uses_gpu: false
  phase17_uses_rag_rerun: false
  source_raw: "results/raw/phase15_benchmark/phase15_20260826T203744Z_dae9c3a4/cases.jsonl"
  uses_llm_inference: false
  uses_gpu: false
  uses_rag_rerun: false
  judge_model: "Qwen3-8B"  # post-hoc faithfulness only; not official RAGAS
  judge_backend: "llama_cpp"
  judge_quantisation: "Q4_K_M"
  judge_n_ctx: 4096
  judge_temperature: 0.0
  judge_max_new_tokens: 32
  judge_metric_label: "LLM-as-judge faithfulness (Qwen3-8B, custom/RAGAS-inspired)"
  judge_uses_llm_inference: true
  judge_uses_gpu: true
  judge_uses_rag_rerun: false
  metrics:
    - answer_correctness
    - answer_correctness_claim
    - faithfulness
    - context_precision
    - context_recall
    - context_recall_numeric
    - selective_accuracy
    - coverage
    - abstention_rate
    - unsupported_emitted_rate
    - faithfulness_llm_judge  # post-hoc; not official RAGAS

execution:
  # Detected at runtime; do not hard-code a Colab GPU SKU.
  device: "auto"
  random_seed: 42
  run_id: null  # generated per run if unset
  # Final LLM runs: upload/mount V2 in a standard Google Colab notebook with GPU runtime.
  # Do not rely on Colab CLI / gcloud.

logging:
  level: "INFO"
  console: true
  file: true

# Storage, backup, recovery — see docs/storage_backup_recovery.md
storage:
  roles:
    github: source_version_control
    google_colab: computation_only
    google_drive: persistent_experiment_archive
    local_mac: secondary_offline_backup_and_dev_copy

  google_drive:
    # Logical root on user's Google Drive — NEEDS VERIFICATION until created and confirmed.
    root: "Google Drive/MSc-RAG"
    layout:
      results_raw: "results/raw"
      results_processed: "results/processed"
      results_metrics: "results/metrics"
      results_final: "results/final"
      checkpoints: "checkpoints"
      logs: "logs"
      configs: "configs"
      artifacts: "artifacts"
    # Do not mirror the full V2 git repository on Drive.
    mirror_full_repo: false

  github:
    store:
      - source_code
      - configuration
      - scripts
      - tests
      - documentation
      - project_rules
      - sampling_manifests
      - calibration_manifests
      - final_reproducible_artefacts
      - final_aggregated_metric_tables
    exclude_normally:
      - model_weights
      - huge_raw_experiment_outputs
      - large_caches
      - unnecessary_generated_files

  colab:
    ephemeral_paths:
      - "/content"
    sync_to_drive: true  # required for checkpoints, raw results, logs

  benchmark:
    questions: 140
    architectures: 3
    total_cases: 420
    case_key_template: "{architecture}:{question_id}"
    recovery:
      incremental_save: true
      checkpoint_state: true
      identify_completed: true
      identify_failed: true
      retry_failed: true
      skip_completed: true
      duplicate_prevention: true
      resume_from_latest_checkpoint: true
      never_restart_from_question_1: true

  raw_result_fields:
    - run_id
    - question_id
    - architecture
    - question
    - retrieved_evidence
    - retrieval_scores
    - answer
    - reference_answer
    - verification_result
    - confidence
    - threshold
    - decision  # ANSWER | ABSTAIN
    - latency_seconds
    - model
    - model_version
    - quantisation
    - device
    - gpu
    - configuration
    - random_seed
    - timestamp
    - error

  live_artefact:
    use_actual_v2_rag_code: true
    precomputed_benchmark_lookup_for_fresh_questions: false
    app_entrypoint: "app/streamlit_app.py"
    phase: 20
    shared_pipelines:
      - benchmark_mode
      - live_demonstration_mode

  phase_completion:
    master_record: "project_record/PROJECT_MASTER_RECORD.md"
    backup_template: "project_record/PHASE_COMPLETION_BACKUP_TEMPLATE.md"
    implementation_plan: "docs/IMPLEMENTATION_PLAN.md"
    storage_doc: "docs/storage_backup_recovery.md"
    evidence_dir: "project_record/evidence"
    evidence_template: "project_record/evidence/_TEMPLATE.md"
    evidence_readme: "project_record/evidence/README.md"
    pytest_capture_script: "scripts/capture_pytest_evidence.py"

  validation_evidence:
    required_after_major_phase: true
    markdown_pattern: "project_record/evidence/phase{N}_validation.md"
    artifacts_dir: "project_record/evidence/artifacts"
    status_values:
      - PASS
      - FAIL
      - NEEDS_VERIFICATION
    do_not_fabricate_pass: true
    benchmark_evidence_style: concise_summary_pointing_to_raw_results

