# V2 experiment configuration — Phase 1 foundation.
# Values marked NEEDS_VERIFICATION must be confirmed before the full benchmark.
# Do not treat placeholders as scientifically locked.

project:
  name: "msc-rag-v2"
  title: "Multi-Agent RAG with Uncertainty Quantification for Financial Document QA"
  version: "0.1.0-phase1"

paths:
  # Relative to V2 project root unless overridden at runtime.
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_calibration: "data/calibration"
  data_final: "data/final"
  knowledge_base: "knowledge_base"
  kb_documents: "knowledge_base/documents"
  kb_index: "knowledge_base/index"
  results_raw: "results/raw"
  results_processed: "results/processed"
  results_final: "results/final"
  results_checkpoints: "results/checkpoints"
  results_logs: "results/logs"
  results_config: "results/config"

dataset:
  # NEEDS_VERIFICATION: confirm via load_dataset in Phase 3.
  family: "T2-RAGBench"
  huggingface_id: "G4KMU/t2-ragbench"
  subset: "FinQA"
  test_split: "test"
  calibration_split: "dev"
  prototype_split: "train"
  frozen_test_size: 140
  architectures: 3
  total_cases: 420
  sampling_seed: 42  # FROZEN in Phase 4 — do not change after selected_140_questions.csv
  frozen_test_set: "data/final/selected_140_questions.csv"
  sampling_manifest: "data/final/sampling_manifest.json"
  calibration_size: 40
  calibration_seed: 42
  frozen_calibration_set: "data/calibration/calibration_questions.csv"
  calibration_manifest: "data/calibration/calibration_manifest.json"
  # Phase 2–3 verified live load (see docs/phase3_dataset_verification.md):
  verified_split_counts:
    train: 6251
    dev: 883
    test: 1147
    total: 8281
  source_pdf_path_template: "data/FinQA/{split}/{file_name}"
  test_pdfs_resolved: 380
  test_pdfs_missing: 0
  # Phase 4 freeze summary (see sampling_manifest.json for authority):
  phase4_frozen: true
  phase4_n: 140
  phase4_unique_companies: 77
  phase4_unique_files: 140
  phase4_selected_ids_sha256: "1a69d93e412097a076e8ec836253b8fff53366aefc5ea5f8998020984f6bbd8a"
  # Phase 5 calibration freeze (threshold NOT locked yet):
  phase5_frozen: true
  phase5_n: 40
  phase5_unique_companies: 32
  phase5_unique_files: 40
  phase5_selected_ids_sha256: "b229d45331fc18dd7c784175abd37cee3550775f268c843b2417d3f9d2e3aeca"
  phase5_threshold_locked: false

model:
  name: "Qwen3-8B"
  # Primary remote path: llama_cpp (GGUF on Colab GPU). auto falls back to transformers/CUDA then ollama_dev.
  backend: "auto"
  quantisation: "Q4_K_M"
  model_path: null
  hf_repo_id: "bartowski/Qwen_Qwen3-8B-GGUF"
  gguf_filename: "Qwen3-8B-Q4_K_M.gguf"
  hf_model_id: "Qwen/Qwen3-8B"
  ollama_model: "qwen3:8b"  # optional local smoke only
  n_ctx: 4096
  n_gpu_layers: -1
  load_in_4bit: true
  temperature: 0.1
  top_p: null
  top_k: null
  max_new_tokens: 512
  # Final 420-case benchmark must use Colab GPU (llama_cpp or transformers), not Mac Ollama.

embeddings:
  model: "BAAI/bge-small-en-v1.5"
  version: null  # Hugging Face revision pin NEEDS VERIFICATION if required for paper

retrieval:
  vector_store: "chroma"
  collection_name: "finqa_source_pdfs"
  top_k: 4
  chunk_size: 900
  chunk_overlap: 150
  # Phase 6 verified build:
  phase6_built: true
  phase6_docs_indexed: 230
  phase6_chunks: 1239
  phase6_distractors: 50
  phase6_download_failed: 0
  index_manifest: "knowledge_base/index/index_manifest.json"

uncertainty:
  # Threshold MUST be locked on DEV/calibration only (Phase 15). Never tune on test.
  confidence_threshold: null  # set via results/config/threshold.lock.json later
  method: null  # chosen during calibration phase

evaluation:
  # Metrics wiring begins in later phases; keep placeholders only.
  primary_answer_field: "program_answer"
  secondary_answer_field: "original_answer"
  judge_model: null
  judge_temperature: 0.0

execution:
  # Detected at runtime; do not hard-code a Colab GPU SKU.
  device: "auto"
  random_seed: 42
  run_id: null  # generated per run if unset

logging:
  level: "INFO"
  console: true
  file: true
