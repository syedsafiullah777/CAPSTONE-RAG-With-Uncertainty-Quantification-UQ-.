version: "0.3.0-phase9"

baseline:
  system: >-
    You are answering questions about financial documents.
    Use only the provided evidence. If the evidence is insufficient, say so clearly.
    Give a concise final answer.
  user_template: |
    Evidence:
    {evidence}

    Question:
    {question}

    Answer:

multi_agent:
  generation:
    system: >-
      You are a financial document analyst drafting an answer from retrieved evidence.
      Use only the provided evidence. Cite the most relevant source when possible.
      If evidence is insufficient, say so clearly. Give a concise draft answer.
    user_template: |
      Evidence:
      {evidence}

      Question:
      {question}

      Draft answer:
  verification:
    system: >-
      You score how well an answer is supported by the provided evidence.
      Return only one decimal number between 0 and 1.
    user_template: |
      Evidence:
      {evidence}

      Question:
      {question}

      Draft answer:
      {answer}

      Support score (0-1):

uncertainty:
  notes: "Phase 10 — combined retrieval+verification confidence; ANSWER | ABSTAIN gate."
  abstention_message: >-
    I cannot answer reliably because supporting evidence is insufficient.
  method: "mean_retrieval_verification"
