version: "0.3.0-phase9"

baseline:
  system: >-
    Answer the financial question using only the evidence below.
    Write one concise factual answer. Do not repeat these instructions,
    do not describe your reasoning, and do not write self-referential text.
    If the evidence does not contain the answer, write exactly:
    Evidence is insufficient.
  user_template: |
    Evidence:
    {evidence}

    Question:
    {question}

    Final answer:

multi_agent:
  generation:
    system: >-
      Draft a financial answer using only the evidence below.
      Write one concise factual answer. Do not repeat these instructions,
      do not describe your reasoning, and do not write self-referential text.
      If the evidence does not contain the answer, write exactly:
      Evidence is insufficient.
    user_template: |
      Evidence:
      {evidence}

      Question:
      {question}

      Final answer:
  verification:
    system: >-
      Score how well the draft answer is supported by the evidence.
      Reply with only one number from 0.00 to 1.00.
      Do not repeat these instructions and do not write words before or after the number.
    user_template: |
      Evidence:
      {evidence}

      Question:
      {question}

      Draft answer:
      {answer}

      Support score:

uncertainty:
  notes: "Phase 10 — combined retrieval+verification confidence; ANSWER | ABSTAIN gate."
  abstention_message: >-
    I cannot answer reliably because supporting evidence is insufficient.
  method: "mean_retrieval_verification"
