  <g id="text_20">
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(12.96 380.61652)">T = 0.65 is LOCKED from the separate 40-question FinQA DEV calibration set; it was not tuned on the frozen 140.</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(12.96 390.458762)">Always-answer baselines have coverage = 100%, so selective accuracy equals overall displayed correctness.</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(12.96 400.301004)">UQ abstains on 62/140 questions, raising accuracy among answered cases while reducing coverage. Error bars: Wilson 95% CI. n = 140.</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(12.96 410.143246)">Source: results/metrics/phase17_descriptive.csv.</text>
  </g>
